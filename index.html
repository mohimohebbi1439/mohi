<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>آزمایش اتصال Codex</title>
  <style>
    :root { color-scheme: light; font-family: Tahoma, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb; color: #172033; }
    main { width: min(560px, calc(100% - 40px)); padding: 36px; box-sizing: border-box; background: white; border: 1px solid #e3e8f2; border-radius: 20px; box-shadow: 0 16px 48px #1c2a4414; }
    .badge { display: inline-block; padding: 7px 12px; border-radius: 999px; background: #e8f8ef; color: #187443; font-size: 13px; }
    h1 { margin: 22px 0 12px; font-size: 28px; }
    p { color: #596579; line-height: 1.9; }
    code { direction: ltr; display: inline-block; padding: 3px 8px; border-radius: 6px; background: #f0f2f7; }
  </style>
</head>
<body>
  <main>
    <span class="badge">پروژه آماده است</span>
    <h1>سلام، Codex 👋</h1>
    <p>اگر این فایل را در مخزن <code>mohi</code> می‌بینی، حالا می‌توانی اتصال Codex را آزمایش کنی.</p>
    <p>از Codex بخواه رنگ پس‌زمینه یا متن این صفحه را تغییر دهد و تغییر را ثبت کند.</p>
  </main>
</body>
</html>
